# Trades — shared infrastructure compose (DEVELOPMENT).
#
# Lives in the trades-infra repo (version-controlled). Started by
# `cd ai-standards && make infra-up`, which resolves this file via
# INFRA_DIR=../trades-infra declared in trades-docs/workspace.mk. Per-service
# compose files (e.g. identity-service/docker-compose.yml) join the
# `workspace-network` declared below as an external network.
#
# Versions match ai-standards/standards/tech-stack.md (Postgres 18).
# Production infrastructure is NOT this file — see deploy/README.md.

# `name:` pins the compose project name. It was `workspacetrades` while this
# file lived at the workspace root (derived from the directory name); pinning it
# here keeps the existing volumes (workspacetrades_postgres_data /
# workspacetrades_clamav_db) and running containers attached after the move.
# Do NOT change it or Postgres/ClamAV data will appear empty on the next up.
name: workspacetrades

services:
  postgres:
    # imresamu/postgis is the multi-arch (amd64 + arm64) build of the SAME
    # upstream PostGIS Dockerfiles, maintained by a PostGIS contributor. The
    # official postgis/postgis:18-* is amd64-only, which forced Rosetta/QEMU
    # emulation on Apple Silicon (slow). This variant runs natively on both
    # arches, so no platform pin is needed. Same PG 18 + PostGIS 3.6 → the
    # existing postgres_data volume is compatible (no re-init).
    # Digest-pinned (BR-2, `make image-pins` — a tag is not a pin). Re-resolve after a bump
    # with `docker buildx imagetools inspect imresamu/postgis:<tag>`.
    image: imresamu/postgis:18-3.6@sha256:b5766ee720aca09c61b9a868abefbf273348a4b90ad4cf146b4f8c9ac85d48e4
    container_name: trades-postgres
    # Every service in the workspace depends on this container AND uses it as the
    # `doctrine://` Messenger transport, so it must come back with the Docker daemon
    # exactly like its dependents do. Without this, a `docker desktop restart` returns
    # the ten `unless-stopped` containers and leaves them crash-looping on
    # `could not translate host name "trades-postgres"` until someone runs `make infra-up`.
    restart: unless-stopped
    environment:
      # Single Postgres instance hosts one database PER service. Each service
      # creates its own database via the init script below — services never share.
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace
    ports:
      # Loopback only — same reasoning as clamav below. The credentials here are
      # `workspace`/`workspace` and `pg_hba` ends in `host all all all scram-sha-256`,
      # so a `0.0.0.0` bind puts every service database on the developer's LAN. The
      # compose network gives every service in-cluster access by the `postgres` service
      # name. To reach it from another device deliberately, change these lines.
      #
      # Both loopback families are bound on purpose: `localhost` resolves to ::1 first on
      # macOS, and leaving the v6 address free lets an unrelated local process answer on it
      # instead — the IPv6 clash that already forced the SPA off port 5173.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      # Postgres 18 expects the mount at /var/lib/postgresql (NOT /data) so the
      # versioned subdirectory layout works — see the upstream image notice.
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - workspace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `rabbitmq` lived here until the modular-monolith migration completed (ADR-076, Wave 8).
  #
  # It carried cross-SERVICE messaging for eight services. Seven of them are bundles inside
  # `trades-backend` now — their edges are in-process or `doctrine://` — and the eighth,
  # media-service, only ever used the broker as a loopback to itself, so its two internal
  # queues moved to `doctrine://` against its own database. `doctrine://` is also a durable
  # queue and also needs a running `messenger:consume` worker; what disappeared is the
  # BROKER, not the workers.
  #
  # Removing it here does NOT delete the queues, exchanges or bindings on a broker that has
  # already run — `symfony/amqp-messenger` has no `unbind` call, so every binding this
  # workspace ever created survives its config. Deleting the container and its volume is the
  # operational half, and on a dev host that is the whole of it.
  #
  # Bringing it back is this block plus `symfony/amqp-messenger`, an `ext-amqp` build stage
  # and a DSN. The three graduation triggers that would once have justified it were recorded
  # only in the unversioned migration plan, which no longer exists — so it now needs a fresh
  # ADR in `../trades-docs/decisions.md`, not a citation.

  mailpit:
    # Off `latest` and digest-pinned (production-packaging-promotion-lane BR-2): it was the
    # only unpinned image across the four code repositories. Development only — production
    # uses the real mailer (deploy/docker-compose.prod.yml has no mailpit).
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    container_name: trades-mailpit
    # Same reason as postgres above: services send through it, so it returns with them.
    restart: unless-stopped
    ports:
      # Loopback only — the web UI and its `/api/v1/messages` endpoint are
      # UNAUTHENTICATED, and every password-reset and email-verification link in the
      # workspace lands in this inbox.
      - "127.0.0.1:1025:1025" # SMTP
      - "[::1]:1025:1025"
      - "127.0.0.1:8025:8025" # Web UI
      - "[::1]:8025:8025"
    networks:
      - workspace-network

  clamav:
    # Antivirus daemon consumed by media-service's scan worker (Slice 6.2).
    # Pinned to 1.5.2-debian13-slim per SC-005 + AD-11 — :stable would track a
    # moving target and a future signature-DB format change could silently
    # break operator dashboards on freshclam warnings. The -debian13-slim
    # variant is multi-arch (amd64 + arm64 + ppc64le) so Apple Silicon hosts
    # run it natively; the bare `1.5.2` tag is Alpine-amd64-only.
    # Digest-pinned (BR-2). Re-resolve with `docker buildx imagetools inspect clamav/clamav:<tag>`.
    image: clamav/clamav:1.5.2-debian13-slim@sha256:14e2e0805c6a5ff6728ea591c05565e0f0954d93e8701919012c3a8c44e20674
    container_name: trades-clamav
    restart: unless-stopped
    ports:
      # Loopback only — clamd has no authentication by default and must not
      # be reachable from the host LAN. The compose network gives the worker
      # in-cluster access via the `clamav` service name on workspace-network.
      - "127.0.0.1:3310:3310"
      - "[::1]:3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav   # persists signature DB across restarts
    networks:
      - workspace-network
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # long warm-up: freshclam pulls the initial signature DB

volumes:
  postgres_data:
  clamav_db:

networks:
  workspace-network:
    name: workspace-network
    driver: bridge
