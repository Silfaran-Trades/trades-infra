# Trades — production compose, single-host baseline (production-packaging-promotion-lane, BR-18;
# adapted by production-infrastructure-first-deploy, 10.6 — ADR-124/125/126).
# Derived from ai-standards/templates/deploy/docker-compose.prod.yml.template.
# Authoritative rules: ai-standards/standards/deployment.md; perimeter: ADR-120 (amended by 10.6).
#
# WHAT RUNS (the runtime set, RUNBOOK.md § "The runtime set"):
#   caddy               the perimeter — the ONLY service publishing host ports (80/443)
#   app                 trades-backend (php-fpm + nginx under supervisord), the one MIGRATOR
#   worker-default      trades-backend image, `messenger:consume async_default`
#   worker-heavy        trades-backend image, `messenger:consume async_heavy`
#   worker-scheduler    trades-backend image, the nine `schedule://` transports (18 jobs)
#   mercure             the Chat SSE hub, served at api.{DOMAIN}/.well-known/mercure
#   media               media-service (php-fpm + nginx + its two workers under supervisord)
#   clamav              the antivirus daemon the media scan worker calls
#   storage / storage-init   MinIO (ADR-126: the last community images, mirrored into this
#                       project's ECR) + the one-shot bucket bootstrap
#   mailpit             stage-1 mail capture (BR-25): every message the platform sends lands
#                       here and nothing leaves the host; viewer at mail.{DOMAIN} behind basic auth
#   postgres            PostgreSQL 18 + PostGIS — one instance, `trades_app` + `media`
#
# INTERPOLATION comes from `deploy/.env` (host state, gitignored; documented in
# rehearsal/templates/deploy.env.template): REGISTRY (the ECR registry host, `terraform
# output registry` — BR-23), APP_TAG / MEDIA_TAG / WEB_TAG (full git SHAs, maintained by
# deploy.sh — never by hand, never `latest`), DOMAIN (`terraform output public_hostname` in
# stage 1 — BR-15), CADDY_TLS_ARG (the ACME e-mail in production, `internal` in the
# rehearsal), BASIC_AUTH_USER / BASIC_AUTH_HASH (the stage-1 perimeter credential, BR-18/19 —
# the hash SINGLE-QUOTED, compose silently corrupts an unquoted `$`), BACKUPS_BUCKET (read by
# deploy.sh / backup-postgres.sh, not by compose), and optionally TRADES_SECRETS_DIR
# (default /srv/trades/secrets) + TRADES_PROD_SUBNET.
#
# SECRETS never live in this file: `env_file:` points at the host's per-service env files
# (deployment.md § "Secrets in production"; chmod 600, gitignored) and file-shaped secrets
# (the JWT key pair, the FCM credentials, the dummy password hash) are mounted READ-ONLY from
# {TRADES_SECRETS_DIR}/files/ — never baked into an image (SC-006).
#
# HARDENING (BR-4, AS-019): every service runs `read_only: true`; tmpfs only where the process
# writes. The three deployables run as non-root inside their images. Container logs: the
# `local` driver caps the LIVE buffer's size — it is not retention; durability is the
# `caddy-logs` volume (the perimeter's own file) + deploy.sh's pre-recreate archive (DE-007).
#
# NETWORK: one bridge with a FIXED subnet. `TRUSTED_PROXIES` in app.env / media.env names
# this subnet (BR-30) — the backends trust `X-Forwarded-*` only from it, and Caddy is the
# only thing on it that speaks to the internet.
#
# Images: the three deployables are SHA-tagged `${REGISTRY}/trades/<name>:<sha>` — built on
# the developer's Mac by scripts/promote.sh from a pristine archive of the commit, scanned,
# pushed to ECR (IMMUTABLE tags, ADR-125) and pulled by the host through its instance profile
# (no registry credential on the host). The object store runs the mirrored images from the
# same registry BY DIGEST (BR-33); every other infrastructure image is digest-pinned (BR-2,
# `make image-pins`). Re-resolve with `docker buildx imagetools inspect <image>:<tag>`.
# No image reference names quay.io or ghcr.io (AC-24).

name: trades-prod

networks:
  prod-network:
    name: trades-prod-network
    driver: bridge
    ipam:
      config:
        - subnet: ${TRADES_PROD_SUBNET:-172.30.0.0/24}

volumes:
  postgres-data:
  storage-data:
  clamav-db:
  caddy-data:      # certificates — losing this re-issues certs (rate-limited!)
  caddy-config:
  # The perimeter's request log (LO-009 / DE-007): a named volume outlives every recreate.
  caddy-logs:
  # The captured-mail store (BR-25): bounded by MP_MAX_MESSAGES / MP_MAX_AGE below; an
  # inventoried personal-data store (pii-inventory.md `channel:captured-mail`), ends at 10.9.
  mailpit-data:

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [prod-network]
  # LIVE BUFFER ONLY — bounds what an unbounded talker can do to the disk. Not retention.
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

# Everything the app container and its three workers share: the same image + tag (a worker
# carries NO separate tag — deploy.sh recreates them on APP_TAG after the app), the same
# env file, the same read-only posture, the same secret files.
x-app-common: &app-common
  <<: *service-defaults
  image: ${REGISTRY:?set REGISTRY in deploy/.env}/trades/trades-backend:${APP_TAG:?run deploy.sh}
  env_file:
    - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/app.env
  read_only: true
  # var/ (compiled cache, logs) is PER CONTAINER: each one rebuilds its own cache at start
  # (docker/entrypoint.sh, DE-001) — 1 GB warmup ceiling, so the tmpfs is sized to hold the
  # compiled container plus logs. /tmp: php-fpm, nginx (temp paths, pid), supervisord.
  tmpfs:
    - /tmp:size=256m,mode=1777
    - /var/www/html/var:size=512m,uid=33,gid=33,mode=0750
  volumes:
    - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/files:/run/secrets/files:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---- the perimeter --------------------------------------------------------------------
  caddy:
    <<: *service-defaults
    # Pinned to the 2.11 MINOR the Caddyfile was verified on (roll_interval, ip_mask are
    # version-dependent), plus the digest. On a bump re-run deployment.md § DE-004 checks.
    image: caddy:2.11@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    # The ONLY published ports. The two variables exist for the rehearsal machine (a developer
    # laptop may already hold 80/443); production leaves them at the defaults.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # Substituted into the Caddyfile at parse time ({$DOMAIN}, {$CADDY_TLS_ARG},
      # {$BASIC_AUTH_USER}, {$BASIC_AUTH_HASH}).
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      # `tls <email>`: the ACME registration e-mail in production (Let's Encrypt, with
      # Caddy's ZeroSSL fallback enabled by the e-mail — BR-16); `internal` in the
      # rehearsal (Caddy's local CA; verification is never switched off).
      CADDY_TLS_ARG: ${CADDY_TLS_ARG:?set CADDY_TLS_ARG in deploy/.env}
      # The stage-1 perimeter credential (BR-18): basic auth on app. and mail. only. The
      # hash comes from `caddy hash-password` and MUST be single-quoted in deploy/.env
      # (BR-19; verify with `docker compose config` before the first start).
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in deploy/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in deploy/.env (single-quoted)}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # ⚠ ADDING A VOLUME NEEDS `up -d`, NOT `restart` (see the template's warning): a restart
      # reuses the old mount set and Caddy silently logs into its own writable layer instead.
      - caddy-logs:/var/log/caddy
    healthcheck:
      # The admin API answers on loopback only; a 200 here proves the config loaded.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- trades-backend: the app + the three workers, ONE image ----------------------------
  app:
    <<: *app-common
    environment:
      # The ONE container that applies migrations (BR-7). Workers never do.
      RUN_MIGRATIONS: "1"
    healthcheck:
      # 127.0.0.1, never localhost (busybox-style resolvers try ::1 first). The prod image ships
      # curl; deploy.sh's readiness gate execs the same probe.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # migrations + cache:clear + a 1 GB warmup happen before nginx answers
      start_period: 180s

  # Workers wait for the app to be HEALTHY: that staggers the four 1 GB compiles by
  # construction and keeps them off a schema the migrations have not reached (spec § Open
  # Questions). The entrypoint's `exec` makes `php` PID 1 — the healthcheck asserts exactly
  # that (DE-003), never `pgrep -f` (which matches a wrapping shell and flaps mid-warmup).
  worker-default:
    <<: *app-common
    command: ["php", "bin/console", "messenger:consume", "async_default", "--time-limit=3600", "--memory-limit=128M"]
    depends_on:
      postgres: { condition: service_healthy }
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = php ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  worker-heavy:
    <<: *app-common
    command: ["php", "bin/console", "messenger:consume", "async_heavy", "--time-limit=3600", "--memory-limit=256M"]
    depends_on:
      postgres: { condition: service_healthy }
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = php ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  # The nine `schedule://` transports — the same positional list as trades-backend's
  # docker-compose.yml (which ConsumedTransportRetryStrategyTest parses; keep them equal).
  # The five MODULE_* flags and DEMAND_AI_WRITTEN_PARSE_ENABLED are resolved at container
  # COMPILE time: a flip is `up -d --force-recreate app worker-scheduler`, never a restart
  # (BR-22, RUNBOOK.md § "Feature flags").
  worker-scheduler:
    <<: *app-common
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "scheduler_contracts", "scheduler_labor", "scheduler_serviceorders", "scheduler_company", "scheduler_profile", "scheduler_demand", "scheduler_telemetry", "scheduler_audit", "--time-limit=3600", "--memory-limit=128M"]
    depends_on:
      postgres: { condition: service_healthy }
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = php ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  # ---- Mercure hub — Chat's SSE transport, served under api.{DOMAIN}/.well-known/mercure ----
  # DEDICATED hub keypair (never the Lexik identity key). mercure.env carries
  # MERCURE_PUBLISHER_JWT_KEY (MUST equal app.env's MERCURE_JWT_SECRET) and
  # MERCURE_SUBSCRIBER_JWT_KEY (MUST equal app.env's) — the rehearsal writes both from one
  # generated value; in production the runbook's rotation step changes both files together.
  mercure:
    <<: *service-defaults
    image: dunglas/mercure:v0.16@sha256:0612e5cb86e276fba6df5bade62a0a2ef25051af270f8b569caf053be9c245ac
    env_file:
      - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/mercure.env
    environment:
      SERVER_NAME: ":80"
      GLOBAL_OPTIONS: auto_https off
      # Explicit SPA origin — never `*` (invariants.md). Separate from the app's
      # CORS_ALLOW_ORIGIN; both name the same origin.
      MERCURE_EXTRA_DIRECTIVES: cors_origins https://app.${DOMAIN:?set DOMAIN in deploy/.env}
    read_only: true
    tmpfs:
      - /data:size=64m
      - /config:size=16m
      - /tmp:size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- media-service: php-fpm + nginx + scan/process workers under supervisord -------------
  media:
    <<: *service-defaults
    image: ${REGISTRY:?set REGISTRY in deploy/.env}/trades/media-service:${MEDIA_TAG:?run deploy.sh}
    env_file:
      - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/media.env
    environment:
      RUN_MIGRATIONS: "1"
    read_only: true
    # /tmp sized to at least twice the largest accepted upload (200 MiB, services.yaml
    # `max_bytes`): imagick and the scan worker stage files there (BR-4).
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /var/www/html/var:size=256m,uid=33,gid=33,mode=0750
    volumes:
      - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/files:/run/secrets/files:ro
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_started }
    healthcheck:
      # /api/health (bucket probe) AND both consumers RUNNING under supervisord.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/api/health >/dev/null && [ \"$(supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status scan-worker process-worker | grep -c RUNNING)\" = 2 ] || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  clamav:
    <<: *service-defaults
    image: clamav/clamav:1.5.2-debian13-slim@sha256:14e2e0805c6a5ff6728ea591c05565e0f0954d93e8701919012c3a8c44e20674
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /run:size=16m
      - /var/log/clamav:size=32m
    volumes:
      - clamav-db:/var/lib/clamav   # signature DB — persists across restarts/recreates
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # freshclam pulls the initial signature DB on first boot

  # ---- object storage (MinIO, ADR-126) — public endpoint storage.{DOMAIN} ------------------
  # The upstream images no longer exist (MinIO's community edition stopped publishing in
  # October 2025 and both 10.4 digests return "no such manifest" on quay.io); stage 1 runs
  # the developer's cached copies, pushed ONCE into this project's ECR by
  # scripts/mirror-object-store-images.sh and referenced here BY DIGEST (BR-33, AC-24).
  # The digests below are the ones ECR reported for the single-platform (arm64) push of the
  # 10.4 releases (RELEASE.2025-09-07T16-13-09Z and RELEASE.2025-08-13T08-35-41Z), pinned at
  # Phase 7 step 6 (2026-10-03); they differ from the upstream manifest-LIST digests 10.4
  # carried. The rehearsal substitutes its locally-tagged copies (rehearsal/rehearse.sh).
  # Synthetic media only; native S3 before the first real data (BR-29, BR-33).
  storage:
    <<: *service-defaults
    image: ${REGISTRY:?set REGISTRY in deploy/.env}/trades/minio@sha256:9966a92a734f9411e32f4f41d7d9d826fcdc0f68c4e20b70295bd4e7c11f8a2f
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/storage.env   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap (idempotent). `media` waits for it to complete successfully.
  storage-init:
    image: ${REGISTRY:?set REGISTRY in deploy/.env}/trades/mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
    networks: [prod-network]
    restart: "no"
    env_file:
      - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/storage.env
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /root/.mc:size=16m
    depends_on:
      storage: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo 'waiting for storage...'; sleep 1
        done
        mc mb --ignore-existing local/media-public
        mc mb --ignore-existing local/media-private
        mc anonymous set download local/media-public
        : > /tmp/.bootstrap-probe
        mc cp /tmp/.bootstrap-probe local/media-public/.bootstrap-probe
        echo 'media-public (anonymous download) + media-private buckets ready'

  # ---- stage-1 mail capture (BR-25, AC-7) — viewer at mail.{DOMAIN} behind basic auth --------
  # The development compose's existing pin, reused. SMTP (1025) and the viewer (8025) are
  # reachable on the internal network only — no published port; app.env's MAILER_DSN is
  # `smtp://mailpit:1025` and nothing delivers to the internet. The store is BOUNDED
  # (500 messages / 14 days — pii-inventory.md `channel:captured-mail`) and lives in its own
  # named volume. Nothing depends on it, so deploy.sh ensures it like the perimeter and the
  # hub (`up -d --no-recreate`) and gates it with `app`. Ends at 10.9 (SES with the domain).
  mailpit:
    <<: *service-defaults
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: "14d"
      MP_DATABASE: /data/mailpit.db
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL 18 + PostGIS — one instance, `trades_app` + `media` ------------------------
  postgres:
    <<: *service-defaults
    image: imresamu/postgis:18-3.6@sha256:b5766ee720aca09c61b9a868abefbf273348a4b90ad4cf146b4f8c9ac85d48e4
    env_file:
      - ${TRADES_SECRETS_DIR:-/srv/trades/secrets}/postgres.env   # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run/postgresql:size=16m
    volumes:
      # Postgres 18 expects the mount at /var/lib/postgresql (NOT /data) — versioned layout.
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- the SPA: a static-file image (vite build + unprivileged nginx on 8080) ---------------
  web:
    <<: *service-defaults
    image: ${REGISTRY:?set REGISTRY in deploy/.env}/trades/trades-front:${WEB_TAG:?run deploy.sh}
    # No env_file: VITE_* are build-time, and secrets are never safe there anyway. The image's
    # nginx emits the SPA's own security headers (CSP, HSTS, COOP/CORP — BR-15a) and logs
    # with the lo009 format (LO-009).
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
